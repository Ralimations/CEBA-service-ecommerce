name: Phase 2 isolated verification

on:
  pull_request:
  push:
    branches: [phase2a/meeting-two-feedback]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: phase2_test
          POSTGRES_PASSWORD: phase2_test_only
          POSTGRES_DB: soiree_phase2_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U phase2_test -d soiree_phase2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://phase2_test:phase2_test_only@127.0.0.1:5432/soiree_phase2_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:phase2
